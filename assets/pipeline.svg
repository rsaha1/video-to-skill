<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-label="Pipeline: ingest, extract, capability gate, execute, propose. If a step has no tool, the run stops and reports.">
<rect x="0.5" y="0.5" width="1279" height="329" rx="16" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="40" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#0b0b0b">How a video becomes a skill</text>
<rect x="40" y="64" width="208" height="150" rx="12" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
<circle cx="68" cy="94" r="13" fill="#0b0b0b"/>
<text x="68" y="99" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">1</text>
<text x="90" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0b0b0b">Ingest</text>
<text x="58" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">Transcript, plus frames</text>
<text x="58" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">only where the narrator</text>
<text x="58" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">points at the screen</text>
<path d="M254 139.0 H280" stroke="#898781" stroke-width="2" stroke-linecap="round"/>
<path d="M274 133.0 L282 139.0 L274 145.0" fill="none" stroke="#898781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="288" y="64" width="208" height="150" rx="12" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
<circle cx="316" cy="94" r="13" fill="#0b0b0b"/>
<text x="316" y="99" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">2</text>
<text x="338" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0b0b0b">Extract</text>
<text x="306" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">A step table with the</text>
<text x="306" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">exact command and an</text>
<text x="306" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">evidence tag per step</text>
<path d="M502 139.0 H528" stroke="#898781" stroke-width="2" stroke-linecap="round"/>
<path d="M522 133.0 L530 139.0 L522 145.0" fill="none" stroke="#898781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="536" y="64" width="208" height="150" rx="12" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/>
<circle cx="564" cy="94" r="13" fill="#0b0b0b"/>
<text x="564" y="99" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">3</text>
<text x="586" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0b0b0b">Capability gate</text>
<text x="554" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">Every step must map</text>
<text x="554" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">to a tool Claude can</text>
<text x="554" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">operate in the session</text>
<path d="M750 139.0 H776" stroke="#898781" stroke-width="2" stroke-linecap="round"/>
<path d="M770 133.0 L778 139.0 L770 145.0" fill="none" stroke="#898781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="784" y="64" width="208" height="150" rx="12" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
<circle cx="812" cy="94" r="13" fill="#0b0b0b"/>
<text x="812" y="99" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">4</text>
<text x="834" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0b0b0b">Execute</text>
<text x="802" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">Run each step on a</text>
<text x="802" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">disposable sample and</text>
<text x="802" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">measure the result</text>
<path d="M998 139.0 H1024" stroke="#898781" stroke-width="2" stroke-linecap="round"/>
<path d="M1018 133.0 L1026 139.0 L1018 145.0" fill="none" stroke="#898781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1032" y="64" width="208" height="150" rx="12" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
<circle cx="1060" cy="94" r="13" fill="#0b0b0b"/>
<text x="1060" y="99" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">5</text>
<text x="1082" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0b0b0b">Propose</text>
<text x="1050" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">Verified steps only,</text>
<text x="1050" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">with corrections and</text>
<text x="1050" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">pitfalls recorded</text>
<path d="M640.0 218 V248" stroke="#898781" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>
<rect x="450.0" y="252" width="380" height="44" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="640.0" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#52514e">A step with no tool: stop and report. Nothing is saved.</text>
</svg>